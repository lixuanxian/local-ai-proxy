name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac-arm64
          # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
          - os: macos-26-intel
            platform: mac-x64
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve platform config
        id: config
        shell: bash
        run: |
          node -e "
            const { PLATFORMS } = require('./scripts/config');
            const c = PLATFORMS['${{ matrix.platform }}'];
            console.log('output=' + c.targets[0].output);
            console.log('zip=' + c.zip);
          " >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci && cd web && npm ci

      - name: Build, verify & pack
        run: node scripts/dist.js ${{ matrix.platform }}

      - name: Smoke test — health check
        shell: bash
        run: |
          cd dist

          # Make executable on Unix
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x "${{ steps.config.outputs.output }}"
          fi

          # Start app in background
          ./${{ steps.config.outputs.output }} &
          APP_PID=$!

          # Wait for health endpoint (max 30s)
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            RESPONSE=$(curl -sf http://localhost:3199/api/health 2>/dev/null) && {
              echo "Response: $RESPONSE"
              if echo "$RESPONSE" | grep -q '"ok"'; then
                echo "Health check passed!"
                kill $APP_PID 2>/dev/null || true
                wait $APP_PID 2>/dev/null || true
                exit 0
              fi
            }
            sleep 1
          done

          echo "Health check failed after 30s"
          cat error.log 2>/dev/null || true
          cat debug.log 2>/dev/null || true
          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.config.outputs.zip }}
          path: dist/${{ steps.config.outputs.zip }}
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
